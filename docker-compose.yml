services:
  db:
    image: pgvector/pgvector:pg16
    container_name: sos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sos
      POSTGRES_PASSWORD: sos_dev_password
      POSTGRES_DB: social_opinion
    ports:
      - "5432:5432"
    volumes:
      - sos-pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sos -d social_opinion"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  sos-pgdata:
